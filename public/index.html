<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; background: #f0f0f0; display: flex; justify-content: center; padding-top: 50px; }
.box { background: white; width: 100%; max-width: 380px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
.header { background: #0088cc; color: white; padding: 15px; text-align: center; font-weight: bold; }
.messages { padding: 20px; height: 250px; }
.msg { background: #e1f3ff; padding: 10px 14px; border-radius: 12px; display: inline-block; margin-bottom: 10px; }
.input-area { display: flex; border-top: 1px solid #ddd; }
.input-area input { flex: 1; border: none; padding: 15px; outline: none; }
.input-area button { border: none; background: #0088cc; color: white; padding: 0 20px; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <div class="header"></div>
